<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Spacecraft Defender</title>
  <desc id="description">A spacecraft flies toward a formation of glowing UFOs in deep space.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050817"/>
      <stop offset="0.58" stop-color="#0c1430"/>
      <stop offset="1" stop-color="#11102d"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48dffc"/>
      <stop offset="0.52" stop-color="#83a8ff"/>
      <stop offset="1" stop-color="#b58aff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9f7cff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#9f7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="ufo">
      <ellipse cx="0" cy="0" rx="34" ry="12" fill="#765df0" stroke="#b8a9ff" stroke-width="2"/>
      <path d="M-17-2 Q0-25 17-2" fill="#49dffc" fill-opacity=".8" stroke="#b9f7ff" stroke-width="2"/>
      <circle cx="-22" cy="4" r="2.5" fill="#ffca58"/>
      <circle cx="0" cy="7" r="2.5" fill="#ffca58"/>
      <circle cx="22" cy="4" r="2.5" fill="#ffca58"/>
    </g>
  </defs>

  <rect width="1200" height="500" fill="url(#background)"/>
  <circle cx="920" cy="120" r="310" fill="url(#glow)"/>

  <g fill="#d8e7ff">
    <circle cx="88" cy="62" r="1.5"/><circle cx="202" cy="128" r="1"/><circle cx="330" cy="76" r="2"/>
    <circle cx="460" cy="168" r="1.2"/><circle cx="570" cy="51" r="1.6"/><circle cx="718" cy="202" r="1"/>
    <circle cx="826" cy="64" r="1.7"/><circle cx="1095" cy="92" r="1.3"/><circle cx="1140" cy="246" r="2"/>
    <circle cx="130" cy="350" r="1.4"/><circle cx="265" cy="446" r="1"/><circle cx="506" cy="392" r="1.7"/>
    <circle cx="680" cy="458" r="1.2"/><circle cx="1010" cy="418" r="1.6"/>
  </g>

  <g opacity=".9" filter="url(#softGlow)">
    <use href="#ufo" transform="translate(820 105)"/>
    <use href="#ufo" transform="translate(920 105)"/>
    <use href="#ufo" transform="translate(1020 105)"/>
    <use href="#ufo" transform="translate(870 175)"/>
    <use href="#ufo" transform="translate(970 175)"/>
  </g>

  <g transform="translate(913 375)" filter="url(#softGlow)">
    <path d="M0-74 L43 42 L13 29 L0 58 L-13 29 L-43 42 Z" fill="#dbe8ff" stroke="#48dffc" stroke-width="3"/>
    <path d="M0-44 L15 20 L0 10 L-15 20 Z" fill="#172442"/>
    <path d="M-9 49 L0 88 L9 49 Z" fill="#48dffc"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="190" fill="#48dffc" font-size="18" font-weight="700" letter-spacing="5">REBUILT STUDENT PROJECT · 2026</text>
    <text x="66" y="280" fill="#f0f5ff" font-size="80" font-weight="900" letter-spacing="-4">SPACECRAFT</text>
    <text x="66" y="360" fill="url(#titleGradient)" font-size="80" font-weight="900" letter-spacing="-4">DEFENDER</text>
    <text x="72" y="410" fill="#8492ad" font-size="20" letter-spacing="1">HTML5 Canvas · Vanilla JavaScript · CSS</text>
  </g>

  <path d="M0 455 Q290 405 590 460 T1200 448 V500 H0Z" fill="#48dffc" fill-opacity=".04"/>
</svg>
